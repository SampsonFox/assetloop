{{define "market-summary"}}{{$s := .Strings}}{{if .MarketEnabled}}<div class="market-reference" aria-label="{{t $s "market.reference"}}"><img src="/static/zhuanzhuan.ico" width="24" height="24" alt="{{t $s "market.zhuanzhuan"}}">{{with .Market.Latest}}<strong title="{{t $s "market.basis"}}{{if .FX}} · {{money .MaxMinor .Currency}} · {{rate .FX.RateScaled}} · {{date .FX.RateDate}} · {{.FX.RateSource}}{{else}} · {{t $s "market.fx_pending"}}{{end}}">{{if .BaseMinor}}{{money (derefMinor .BaseMinor) .BaseCurrency}}{{else}}{{money .MaxMinor .Currency}}{{end}}</strong><time datetime="{{.ObservedAt.Format "2006-01-02T15:04:05Z07:00"}}" title="{{t $s "market.observed"}}">{{dateTime .ObservedAt}}</time>{{else}}<span class="muted">{{t $s "market.empty"}}</span>{{end}}</div>{{end}}{{end}}
