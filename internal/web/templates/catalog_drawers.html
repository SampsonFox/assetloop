{{define "catalog-drawers"}}
<dialog class="drawer" id="category-drawer" aria-labelledby="category-drawer-title"><form id="category-form" class="drawer-panel stack" action="/admin/catalog/categories" method="post"><header class="drawer-heading"><div><p class="eyebrow">物品类型配置</p><h2 id="category-drawer-title" data-dialog-title>新增类别</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="关闭">×</button></header><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{if eq .CatalogFlow "asset"}}<input type="hidden" name="flow" value="asset">{{end}}<label>类别名称<input name="name" required maxlength="120" placeholder="手机"></label><label>图标<select name="icon_key" required>{{range .CategoryIcons}}<option value="{{.Key}}">{{.Label}}</option>{{end}}</select></label><div class="drawer-actions"><button class="secondary auto" type="button" data-dialog-close>取消</button><button class="auto" type="submit">保存</button></div></form></dialog>

<dialog class="drawer" id="model-drawer" aria-labelledby="model-drawer-title"><form id="model-form" class="drawer-panel stack" action="/admin/catalog/models" method="post"><header class="drawer-heading"><div><p class="eyebrow">物品类型配置</p><h2 id="model-drawer-title" data-dialog-title>新增型号</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="关闭">×</button></header><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{if eq .CatalogFlow "asset"}}<input type="hidden" name="flow" value="asset">{{end}}<div class="form-field"><div class="field-heading"><label for="model-category">所属类别</label><button class="link-button" type="button" data-dialog-open="category-drawer" data-title="新增类别" data-action="/admin/catalog/categories">新增类别</button></div><select id="model-category" name="category_id" required><option value="">请选择</option>{{range .Categories}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></div><label>型号名称<input name="name" required maxlength="160" placeholder="iPhone 17 Pro"></label><div class="drawer-actions"><button class="secondary auto" type="button" data-dialog-close>取消</button><button class="auto" type="submit" {{if not .Categories}}disabled{{end}}>保存</button></div></form></dialog>

<dialog class="drawer" id="variant-drawer" aria-labelledby="variant-drawer-title"><form id="variant-form" class="drawer-panel stack" action="/admin/catalog/variants" method="post"><header class="drawer-heading"><div><p class="eyebrow">物品类型配置</p><h2 id="variant-drawer-title" data-dialog-title>新增规格</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="关闭">×</button></header><input type="hidden" name="csrf_token" value="{{.CSRFToken}}">{{if eq .CatalogFlow "asset"}}<input type="hidden" name="flow" value="asset">{{end}}<div class="form-field"><div class="field-heading"><label for="variant-model">所属型号</label><button class="link-button" type="button" data-dialog-open="model-drawer" data-title="新增型号" data-action="/admin/catalog/models">新增型号</button></div><select id="variant-model" name="model_id" required><option value="">请选择</option>{{range .Models}}<option value="{{.ID}}">{{.CategoryName}} / {{.Name}}</option>{{end}}</select></div><label>规格名称<input name="name" required maxlength="160" placeholder="256GB"></label><div class="drawer-actions"><button class="secondary auto" type="button" data-dialog-close>取消</button><button class="auto" type="submit" {{if not .Models}}disabled{{end}}>保存</button></div></form></dialog>
{{end}}
