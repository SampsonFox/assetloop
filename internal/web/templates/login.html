{{define "content"}}{{$s := .Strings}}
<section class="auth-card">
  <p class="eyebrow">{{t $s "login.eyebrow"}}</p>
  <h1>{{t $s "login.heading"}}</h1>
  {{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>{{t $s "login.username"}}<input name="username" required autofocus autocomplete="username"></label>
    <label>{{t $s "login.password"}}<input name="password" type="password" required autocomplete="current-password"></label>
    <button type="submit">{{t $s "login.submit"}}</button>
  </form>
  {{template "locale-picker" .}}
</section>
{{end}}
