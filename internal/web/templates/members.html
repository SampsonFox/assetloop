{{define "content"}}
<section class="page-heading"><div><p class="eyebrow">租户安全</p><h1>成员与角色</h1></div></section>
{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}
<section class="two-column">
  <div class="card table-card">
    <table><thead><tr><th>用户名</th><th>角色</th><th>加入时间</th></tr></thead>
    <tbody>{{range .Members}}<tr><td>{{.Username}}</td><td><span class="badge">{{.Role}}</span></td><td>{{.CreatedAt.Format "2006-01-02"}}</td></tr>{{end}}</tbody></table>
  </div>
  <form method="post" action="/admin/members" class="card stack">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <h2>新增成员</h2>
    <label>用户名<input name="username" required autocomplete="off"></label>
    <label>初始密码<input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
    <label>角色<select name="role"><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="owner">Owner</option></select></label>
    <button type="submit">创建成员</button>
  </form>
</section>
{{end}}
